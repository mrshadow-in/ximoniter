<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxmox Management - NOD</title>
    <!-- Use relative paths since this is in /pages/ -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/charts.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .container { padding: 20px; color: #fff; background: #1e1e1e; min-height: 100vh; font-family: sans-serif; }
        .chart-container { background: #2d2d2d; padding: 20px; border-radius: 8px; margin-top: 20px; max-width: 800px; }
        h1 { margin-bottom: 20px; }
    </style>
</head>
<body>
    <header>
        <nav aria-label="Main Navigation">
            <a href="#main-content" class="skip-link">Skip to main content</a>
        </nav>
    </header>

    <main id="main-content" class="container">
        <h1>Proxmox Node Metrics</h1>
        <section class="node-selector" aria-labelledby="node-selector-title">
            <h2 id="node-selector-title" class="sr-only">Node Selection</h2>
            <label for="nodeId">Node ID:</label>
            <input type="text" id="nodeId" value="pve1" style="padding: 5px; border-radius: 4px; border: 1px solid #444; background: #333; color: white;">
            <button id="refreshBtn" style="padding: 5px 15px; cursor: pointer; border-radius: 4px; border: none; background: #007bff; color: white;">Refresh Chart Data</button>
        </section>

        <section class="chart-section" aria-labelledby="chart-title">
            <h2 id="chart-title">CPU History</h2>
            <div class="chart-container" role="img" aria-label="Line chart showing CPU usage over the last hour">
                <canvas id="cpuChart"></canvas>
            </div>
            <div id="chart-status" class="sr-only" aria-live="polite"></div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/proxmox.js"></script>
</body>
</html>
