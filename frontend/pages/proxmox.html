<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxmox Management - NOD</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }
        .chart-card {
            background-color: var(--color-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            height: 320px;
            display: flex;
            flex-direction: column;
        }
        .chart-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }
        .chart-wrapper {
            flex-grow: 1;
            position: relative;
        }
        .config-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 1.5rem;
            align-items: start;
        }
        @media (max-width: 992px) {
            .config-grid { grid-template-columns: 1fr; }
            .charts-grid { grid-template-columns: 1fr; }
        }
        .node-badge {
            background: rgba(26, 115, 232, 0.1);
            color: #58a6ff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-test { background-color: var(--color-cta); color: #000; }
        .btn-delete { background-color: #da3633; color: #fff; }
    </style>
</head>
<body style="padding: 2rem;">
    <header style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: flex-end;">
        <div>
            <h1>Proxmox Analyzer</h1>
            <p style="color: var(--color-text-muted); font-size: 0.9rem;">Real-time infrastructure performance monitoring</p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <label for="nodeId" style="font-size: 0.75rem; font-weight: 700; color: var(--color-text-muted);">ACTIVE NODE</label>
            <input type="text" id="nodeId" value="pve1" style="width: 140px;">
            <button id="refreshBtn" class="btn-primary" style="padding: 8px 16px;">Reload</button>
        </div>
    </header>

    <div class="charts-grid">
        <div class="chart-card">
            <span class="chart-title">CPU Utilization (%)</span>
            <div class="chart-wrapper"><canvas id="cpuChart"></canvas></div>
        </div>
        <div class="chart-card">
            <span class="chart-title">Memory Usage (GB)</span>
            <div class="chart-wrapper"><canvas id="memChart"></canvas></div>
        </div>
        <div class="chart-card">
            <span class="chart-title">Disk Storage (GB)</span>
            <div class="chart-wrapper"><canvas id="diskChart"></canvas></div>
        </div>
        <div class="chart-card">
            <span class="chart-title">Network Throughput (MB/s)</span>
            <div class="chart-wrapper"><canvas id="netChart"></canvas></div>
        </div>
    </div>

    <div class="config-grid">
        <section class="card">
            <h2 style="font-size: 1.1rem; margin-bottom: 1.5rem;">Configured Clusters</h2>
            <div id="node-config-list">
                <div style="color: var(--color-text-muted);">Loading configurations...</div>
            </div>
        </section>

        <section class="card">
            <h2 style="font-size: 1.1rem; margin-bottom: 1.5rem;">Add New Node</h2>
            <form id="add-node-form" style="display: flex; flex-direction: column; gap: 12px;">
                <input type="text" id="node-name" placeholder="Friendly Name" required>
                <input type="text" id="node-host" placeholder="Host IP / FQDN" required>
                <input type="text" id="node-pve" placeholder="PVE Node ID (e.g. pve1)" required>
                <input type="text" id="node-tokenId" placeholder="API Token ID" required>
                <input type="password" id="node-tokenSecret" placeholder="API Token Secret" required>
                <button type="submit" style="background: var(--color-cta); color: #000; margin-top: 10px;">Add Cluster</button>
            </form>
        </section>
    </div>

    <div id="chart-status" class="sr-only" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/proxmox.js"></script>
</body>
</html>
