<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management - NOD</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        body { padding: 20px; color: #c9d1d9; font-family: "Inter", sans-serif; background: #0d1117; margin: 0; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 6px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #30363d; }
        th { color: #8b949e; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { padding: 8px; background: #0d1117; color: white; border: 1px solid #30363d; border-radius: 4px; }
        button { padding: 8px 16px; background: #2ea043; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: 600; }
        .btn-danger { background: #da3633; }
        .badge { background: rgba(26, 115, 232, 0.15); color: #58a6ff; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>
    <header>
        <nav aria-label="Main Navigation">
            <a href="#main-content" class="skip-link">Skip to main content</a>
        </nav>
    </header>

    <main id="main-content">
        <h1>User Management</h1>

        <section class="add-user-section">
            <div class="card">
                <h3>Add New User</h3>
                <form id="add-user-form" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;">
                    <div>
                        <label for="new-username" style="display:block; font-size: 11px; color:#8b949e; margin-bottom:4px;">USERNAME</label>
                        <input type="text" id="new-username" placeholder="Username" required>
                    </div>
                    <div>
                        <label for="new-password" style="display:block; font-size: 11px; color:#8b949e; margin-bottom:4px;">PASSWORD</label>
                        <input type="password" id="new-password" placeholder="Password" required>
                    </div>
                    <div>
                        <label for="new-role" style="display:block; font-size: 11px; color:#8b949e; margin-bottom:4px;">ROLE</label>
                        <select id="new-role">
                            <option value="admin">Admin</option>
                            <option value="staff">Staff</option>
                            <option value="feature_user">Feature User</option>
                        </select>
                    </div>
                    <button type="submit">Create Account</button>
                </form>
            </div>
        </section>

        <section class="user-list-section">
            <div class="card">
                <h3>System Users</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Last Login</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="user-list">
                        <tr><td colspan="4">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script>
        async function loadUsers() {
            try {
                const response = await window.api.get('/users');
                const list = document.getElementById('user-list');
                
                if (response.success) {
                    list.innerHTML = response.data.map(u => `
                        <tr>
                            <td><strong>${u.username}</strong></td>
                            <td><span class="badge">${u.role}</span></td>
                            <td style="font-size: 12px; color: #8b949e;">${u.last_login ? new Date(u.last_login).toLocaleString() : 'Never'}</td>
                            <td style="text-align: right;">
                                <button class="btn-danger" onclick="deleteUser(${u.id}, '${u.username}')" style="padding: 4px 10px; font-size: 12px;">Delete</button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                console.error('Failed to load users:', e);
                document.getElementById('user-list').innerHTML = '<tr><td colspan="4">Error loading users.</td></tr>';
            }
        }

        window.deleteUser = async function(id, username) {
            if (username === 'admin') return alert('Cannot delete the primary admin account.');
            if (!confirm(`Are you sure you want to delete user "${username}"?`)) return;
            
            try {
                const res = await window.api.delete(`/users/${id}`);
                if (res.success) loadUsers();
            } catch (e) {
                alert('Failed to delete user: ' + (e.response?.data?.error || e.message));
            }
        };

        document.getElementById('add-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                username: document.getElementById('new-username').value,
                password: document.getElementById('new-password').value,
                role: document.getElementById('new-role').value
            };
            
            try {
                const res = await window.api.post('/users', payload);
                if (res.success) {
                    e.target.reset();
                    loadUsers();
                }
            } catch (err) {
                alert('Failed to create user: ' + (err.response?.data?.error || err.message));
            }
        });

        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
