<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - NOD</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .user-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 1rem;
        }
        .user-table th {
            text-align: left;
            padding: 1rem;
            color: var(--color-text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--color-border);
        }
        .user-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--color-border);
            font-size: 0.9rem;
        }
        .user-table tr:last-child td {
            border-bottom: none;
        }
        .role-badge {
            background: rgba(88, 166, 255, 0.1);
            color: #58a6ff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .role-super_admin { background: rgba(137, 87, 229, 0.1); color: #bc8cff; }
        .role-admin { background: rgba(88, 166, 255, 0.1); color: #58a6ff; }
        .role-staff { background: rgba(35, 134, 54, 0.1); color: #3fb950; }

        .add-user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-items: flex-end;
        }
    </style>
</head>
<body style="padding: 2rem;">
    <header style="margin-bottom: 2rem;">
        <h1>User Management</h1>
        <p style="color: var(--color-text-muted);">Administrate system access and permission levels</p>
    </header>

    <section class="card" style="margin-bottom: 2rem;">
        <h3 style="margin-bottom: 1.5rem; font-size: 1rem;">Create New Account</h3>
        <form id="add-user-form" class="add-user-grid">
            <div>
                <label for="new-username" class="sr-only">Username</label>
                <input type="text" id="new-username" placeholder="Username" required style="width: 100%;">
            </div>
            <div>
                <label for="new-password" class="sr-only">Password</label>
                <input type="password" id="new-password" placeholder="Password" required style="width: 100%;">
            </div>
            <div>
                <label for="new-role" class="sr-only">Role</label>
                <select id="new-role" style="width: 100%;">
                    <option value="admin">Administrator</option>
                    <option value="staff">Staff Operator</option>
                    <option value="feature_user">Feature User</option>
                </select>
            </div>
            <button type="submit" class="btn-primary" style="height: 42px;">Provision User</button>
        </form>
    </section>

    <section class="card">
        <h3 style="margin-bottom: 1rem; font-size: 1rem;">Authenticated Users</h3>
        <table class="user-table">
            <thead>
                <tr>
                    <th>Identity</th>
                    <th>Access Level</th>
                    <th>Last Active</th>
                    <th style="text-align: right;">Action</th>
                </tr>
            </thead>
            <tbody id="user-list">
                <tr><td colspan="4" style="color: var(--color-text-muted); text-align: center;">Querying database...</td></tr>
            </tbody>
        </table>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script>
        async function loadUsers() {
            try {
                const response = await window.api.get('/users');
                const list = document.getElementById('user-list');
                
                if (response.success) {
                    list.innerHTML = response.data.map(u => `
                        <tr>
                            <td><div style="font-weight: 600;">${u.username}</div></td>
                            <td><span class="role-badge role-${u.role}">${u.role.replace('_', ' ')}</span></td>
                            <td style="color: var(--color-text-muted); font-size: 0.8rem;">${u.last_login ? new Date(u.last_login).toLocaleString() : 'Never'}</td>
                            <td style="text-align: right;">
                                <button onclick="deleteUser(${u.id}, '${u.username}')" style="background: transparent; color: #f87171; border: 1px solid rgba(248, 113, 113, 0.2); padding: 5px 12px; font-size: 0.8rem;">Deauthorize</button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                console.error('User fetch error:', e);
                document.getElementById('user-list').innerHTML = '<tr><td colspan="4">Error accessing user registry.</td></tr>';
            }
        }

        window.deleteUser = async function(id, username) {
            if (username === 'admin') return alert('The primary bootstrap account cannot be deleted.');
            if (!confirm(`Are you sure you want to permanently revoke access for "${username}"?`)) return;
            
            try {
                const res = await window.api.delete(`/users/${id}`);
                if (res.success) loadUsers();
            } catch (e) {
                alert('Deauthorization failed: ' + (e.response?.data?.error || e.message));
            }
        };

        document.getElementById('add-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                username: document.getElementById('new-username').value,
                password: document.getElementById('new-password').value,
                role: document.getElementById('new-role').value
            };
            
            try {
                const res = await window.api.post('/users', payload);
                if (res.success) {
                    e.target.reset();
                    loadUsers();
                }
            } catch (err) {
                alert('Provisioning failed: ' + (err.response?.data?.error || err.message));
            }
        });

        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
