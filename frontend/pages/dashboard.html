<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NOD</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .container { padding: 20px; color: #fff; background: #1e1e1e; min-height: 100vh; font-family: sans-serif; }
        .banner { 
            background: #ffc107; 
            color: #000; 
            padding: 10px; 
            text-align: center; 
            font-weight: bold; 
            display: none; 
        }
        .toggle-container { margin-top: 20px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="sandbox-banner" class="banner" role="status" aria-live="polite">SANDBOX MODE ACTIVE</div>
    
    <main class="container" id="main-content">
        <h1>Dashboard</h1>
        <p>Welcome to the NOD Management System.</p>
        
        <div id="error-message" style="color: #ff4444; margin-bottom: 10px; display: none;" role="alert"></div>
        
        <div class="toggle-container">
            <button id="toggle-sandbox">Toggle Sandbox Mode</button>
        </div>
        
        <nav>
            <a href="proxmox.html" style="color: #007bff;">View Proxmox Metrics</a>
        </nav>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
