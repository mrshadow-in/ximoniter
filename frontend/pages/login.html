<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - NOD</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }
        .login-card {
            width: 100%;
            max-width: 360px;
            text-align: center;
            animation: fadeIn 600ms ease-out;
        }
        .login-card h2 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--color-text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
        }
        .btn-login {
            width: 100%;
            background-color: var(--color-cta);
            color: #000;
            padding: 14px;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="login-card card">
        <h2>NOD Dashboard</h2>
        <div id="error-msg" class="error-message" role="alert"></div>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
        <p style="margin-top: 2rem; font-size: 0.75rem; color: var(--color-text-muted);">
            Network Operations Dashboard v1.0
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script>
        // Redirect if already logged in
        if (localStorage.getItem('nod_token')) {
            window.location.href = 'dashboard.html';
        }

        const form = document.getElementById('login-form');
        const errorDiv = document.getElementById('error-msg');
        const submitBtn = form.querySelector('button');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            errorDiv.style.display = 'none';
            submitBtn.innerText = 'Authenticating...';
            submitBtn.disabled = true;

            try {
                // api.js interceptor handles the base path /api
                const res = await window.api.post('/auth/login', { username, password });
                
                if (res.success) {
                    localStorage.setItem('nod_token', res.token);
                    window.location.href = '../index.html';
                }
            } catch (err) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = err.response?.data?.error || 'Authentication failed. Please check your credentials.';
                submitBtn.innerText = 'Sign In';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
