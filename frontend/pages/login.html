<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NOD</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #121212;
        }
        .login-card {
            background-color: #1e1e1e;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }
        .login-card h1 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #fff;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ccc;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: 2px solid #007bff;
            border-color: transparent;
        }
        .login-button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }
        .login-button:hover {
            background-color: #0056b3;
        }
        .login-button:disabled {
            background-color: #444;
            cursor: not-allowed;
        }
        #error-message {
            background-color: #442222;
            color: #ffaaaa;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <main class="login-container" id="main-content">
        <div class="login-card">
            <h1>NOD Login</h1>
            
            <!-- Accessibility Strategy: Live region for dynamic error announcements -->
            <div id="error-message" role="alert" aria-live="polite"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" id="login-btn" class="login-button">Sign In</button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('error-message');
            
            // UI state: Loading
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            errorMsg.style.display = 'none';
            
            try {
                // Use the configured api instance from api.js
                const response = await api.post('/auth/login', { username, password });
                
                // On success: Save token and redirect
                // The api response interceptor returns response.data
                if (response.token) {
                    localStorage.setItem('nod_token', response.token);
                    window.location.href = 'dashboard.html';
                } else {
                    throw new Error('No token received from server');
                }
            } catch (error) {
                console.error('Login failed:', error);
                
                // UI state: Error
                errorMsg.textContent = error.response?.data?.error || 'Login failed. Please check your credentials.';
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // Check if already logged in
        if (localStorage.getItem('nod_token')) {
            // Optional: Verify token or just redirect
            // window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
