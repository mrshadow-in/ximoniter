<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGP Shifting Console - NOD</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        body {
            padding: 2rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--color-background);
        }
        .console-container {
            flex-grow: 1;
            background-color: #000;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 1.5rem;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.9rem;
            overflow-y: auto;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
            margin-top: 1rem;
        }
        .log-entry {
            margin-bottom: 8px;
            display: flex;
            gap: 1rem;
            animation: fadeIn 200ms ease-out;
        }
        .log-time { color: #475569; min-width: 85px; }
        .log-msg { color: var(--color-cta); line-height: 1.4; }
        .log-msg.warning { color: #facc15; }
        .log-msg.error { color: #f87171; }
        .log-msg.info { color: #60a5fa; }
        
        .status-bar {
            display: flex;
            gap: 2rem;
            padding: 1rem;
            background-color: var(--color-secondary);
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-item { display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; }
        .status-dot.active { background: var(--color-cta); box-shadow: 0 0 8px var(--color-cta); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-5px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
    </style>
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h1>BGP Shifting Console</h1>
        <div class="node-badge" id="ws-status">DISCONNECTED</div>
    </header>

    <div class="status-bar">
        <div class="status-item">
            <div id="dot-primary" class="status-dot active"></div>
            <span>Primary Route</span>
        </div>
        <div class="status-item">
            <div id="dot-fallback" class="status-dot"></div>
            <span>Fallback Route</span>
        </div>
        <div class="status-item" style="margin-left: auto;">
            <span style="color: var(--color-text-muted);">Mode:</span>
            <span style="color: var(--color-cta);">Real-time Stream</span>
        </div>
    </div>

    <div class="console-container" id="console" role="log" aria-live="polite">
        <div class="log-entry">
            <span class="log-time">[SYSTEM]</span>
            <span class="log-msg info">Initializing Failover Monitoring Engine...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script>
        const consoleEl = document.getElementById('console');
        const wsStatus = document.getElementById('ws-status');
        const dotPrimary = document.getElementById('dot-primary');
        const dotFallback = document.getElementById('dot-fallback');
        
        function appendLog(msg, type = 'normal') {
            const time = new Date().toLocaleTimeString([], { hour12: false });
            const div = document.createElement('div');
            div.className = 'log-entry';
            
            let msgClass = 'log-msg';
            if (type === 'triggered' || type === 'error') {
                msgClass += ' error';
                dotPrimary.classList.remove('active');
                dotFallback.classList.add('active');
            }
            if (type === 'waiting' || type === 'warning') msgClass += ' warning';
            if (type === 'recovery' || type === 'info') {
                msgClass += ' info';
                if (type === 'recovery') {
                    dotFallback.classList.remove('active');
                    dotPrimary.classList.add('active');
                }
            }
            
            div.innerHTML = `<span class="log-time">[${time}]</span><span class="${msgClass}">${msg}</span>`;
            consoleEl.appendChild(div);
            
            if (consoleEl.children.length > 300) {
                consoleEl.removeChild(consoleEl.children[0]);
            }
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;
        const ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            wsStatus.innerText = 'CONNECTED';
            wsStatus.style.color = 'var(--color-cta)';
            appendLog('Connection established to Failover Engine', 'info');
        };
        
        ws.onclose = () => {
            wsStatus.innerText = 'DISCONNECTED';
            wsStatus.style.color = '#f87171';
            appendLog('Connection lost. Attempting to reconnect...', 'error');
        };

        ws.onmessage = (event) => {
            try {
                const payload = JSON.parse(event.data);
                if (payload.channel === 'failover') {
                    appendLog(payload.data.message, payload.event);
                }
            } catch (e) { console.error('WS Error:', e); }
        };
    </script>
</body>
</html>
