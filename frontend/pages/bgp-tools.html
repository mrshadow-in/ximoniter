<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGP Tools - Intel Lookup</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .search-container {
            max-width: 600px;
            margin-bottom: 2.5rem;
        }
        .result-card {
            display: none;
            animation: slideUp 400ms ease-out;
        }
        pre {
            background-color: #000;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 1.5rem;
            color: var(--color-cta);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            overflow-x: auto;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body style="padding: 2rem;">
    <header style="margin-bottom: 2rem;">
        <h1>BGP Intelligence</h1>
        <p style="color: var(--color-text-muted);">ASN and IP reputation lookup via IPinfo Lite API</p>
    </header>

    <div class="search-container card">
        <form onsubmit="event.preventDefault(); lookup();" style="display: flex; gap: 12px; align-items: center;">
            <input type="text" id="asn-input" placeholder="e.g. 8.8.8.8 or AS13335" required style="flex-grow: 1;">
            <button type="submit" class="btn-primary">Execute Search</button>
        </form>
    </div>

    <div id="result-card" class="result-card">
        <div class="card">
            <h3 style="margin-bottom: 1.5rem; font-size: 1rem;">Lookup Results</h3>
            <pre id="result"></pre>
        </div>
    </div>

    <div id="status-announcer" class="sr-only" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script>
        async function lookup() {
            const query = document.getElementById('asn-input').value.trim();
            if(!query) return;
            
            const resCard = document.getElementById('result-card');
            const resEl = document.getElementById('result');
            const statusEl = document.getElementById('status-announcer');
            
            resCard.style.display = 'block';
            resEl.innerText = 'Initializing remote lookup...';
            statusEl.innerText = 'Searching for ' + query;
            
            try {
                const res = await window.api.get(`/bgp-tools/asn/${query}`);
                if (res && res.success) {
                    resEl.innerText = JSON.stringify(res.data, null, 4);
                    statusEl.innerText = 'Lookup complete.';
                } else {
                    throw new Error(res?.error || 'Intelligence fetch failed');
                }
            } catch (e) {
                const msg = e.response?.data?.error || e.message;
                resEl.innerText = 'SYSTEM ERROR: ' + msg;
                resEl.style.color = '#f87171';
                statusEl.innerText = 'Error: ' + msg;
            }
        }
    </script>
</body>
</html>
