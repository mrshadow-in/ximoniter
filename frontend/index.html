<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOD - Network Operations Dashboard</title>
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <a href="#content-frame" class="skip-link">Skip to main content</a>
    <nav class="sidebar" aria-label="Main Navigation">
        <div class="sidebar-header"><h1>NOD Dashboard</h1></div>
        <a href="pages/dashboard.html" class="nav-item active" target="content-frame" onclick="setActive(this)">Dashboard</a>
        <a href="pages/proxmox.html" class="nav-item" target="content-frame" onclick="setActive(this)">Proxmox Analyzer</a>
        <a href="pages/bgp-tools.html" class="nav-item" target="content-frame" onclick="setActive(this)">BGP Tools</a>
        
        <div style="padding: 20px 20px 5px; font-size: 10px; color: #8b949e; letter-spacing: 1px;">ADMINISTRATION</div>
        <a href="pages/users.html" class="nav-item" target="content-frame" onclick="setActive(this)">User Management</a>
        
        <div style="padding: 20px 20px 5px; font-size: 10px; color: #8b949e; letter-spacing: 1px;">SYSTEM</div>
        <button class="nav-item" onclick="logout()">Logout</button>
    </nav>
    <main class="content-wrapper">
        <iframe id="content-frame" name="content-frame" src="pages/dashboard.html" title="Main Content"></iframe>
    </main>
    <script>
        // Check for authentication token
        if (!localStorage.getItem('nod_token')) {
            window.location.href = 'pages/login.html';
        }

        function setActive(elem) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            elem.classList.add('active');
        }

        function logout() {
            localStorage.removeItem('nod_token');
            window.location.href = 'pages/login.html';
        }
    </script>
</body>
</html>
